
services:
  db:
    build: ./db/
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .db_info
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./BOBcat_website/
    restart: always
    # No external port — nginx handles public access on port 80
    env_file:
      - .db_info
    depends_on:
      db:
        condition: service_healthy

  dachs:
    build: ./dachs/
    restart: always
    env_file:
      - .db_info
    environment:
      # Set DACHS_SERVER_URL to the public base URL of the site so DACHS
      # generates correct self-referential URLs in capabilities/VOTable responses.
      # Defaults to http://localhost for local development.
      - DACHS_SERVER_URL=${DACHS_SERVER_URL:-http://localhost}
      # Non-superuser role DaCHS uses to serve TAP queries (see
      # dachs/entrypoint.sh). Override the password in production via .db_info
      # — the default is a dev-only placeholder. The DB has no external port,
      # so this role is only reachable from inside the compose network.
      - DACHS_QUERY_USER=${DACHS_QUERY_USER:-dachs_query}
      - DACHS_QUERY_PASSWORD=${DACHS_QUERY_PASSWORD:-dachs_query_pw}
    depends_on:
      db:
        condition: service_healthy
    # Only healthy once gavo serve actually answers TAP requests — the
    # entrypoint's gavo init/imp sequence takes a while on first start,
    # hence the long start_period.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://localhost:8080/tap/availability"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 180s
    # No external port — nginx routes /tap/* to dachs:8080

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_started
      dachs:
        condition: service_healthy

  ingest:
    build: ./BOBcat_website/
    env_file:
      - .db_info
    depends_on:
      db:
        condition: service_healthy
    command: python manage.py Jordans_ingestion
    profiles:
      - ingest

volumes:
  postgres_data:
