
services:
  db:
    build: ./db/
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .db_info
  backend:
    build: ./BOBcat_website/
    restart: always
    # Use the Django development server for auto-reloading
    command: python manage.py runserver 0.0.0.0:8001
    ports:
      - "8001:8001"
    volumes:
      # Maps your local code to the container's working directory.
      # IMPORTANT: Change '/app' to whatever WORKDIR is set in your Dockerfile!
      - ./BOBcat_website/:/app
    env_file:
      - .db_info
    depends_on:
      - db

  ingestion:
    image: python:3.14
    working_dir: /app
    volumes:
      - /Users/sbs/soft/bobcat/bobcat_db_interface:/app
      - /Users/sbs/soft/bobcat/gw_utils/:/tmp/gw_utils
      - ./.db_info:/root/.bobcat/db_info.txt:ro
    environment:
      PYTHONPATH: /app:/tmp/gw_utils
    env_file:
      - .db_info
    depends_on:
      - db
    command: sh -c "pip install -r requirements.txt && pip install /tmp/gw_utils && python bobcat_db_interface/ingestion/ingest.py"

volumes:
  postgres_data: