
services:
  db:
    build: ./db/
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .db_info
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./BOBcat_website/
    restart: always
    ports:
      - "8001:8000"
    env_file:
      - .db_info
    depends_on:
      db:
        condition: service_healthy

  ingest:
    build: ./BOBcat_website/
    env_file:
      - .db_info
    depends_on:
      db:
        condition: service_healthy
    command: python manage.py Jordans_ingestion
    profiles:
      - ingest

volumes:
  postgres_data: