# Rate-limit zones (http context — files under conf.d are included there).
# Keyed by client IP. The TAP/query endpoints run user-supplied ADQL/SQL and
# are the expensive, abusable surface, so they get a tighter budget than the
# rest of the site. 10m of shared memory tracks ~160k distinct IPs per zone.
limit_req_zone  $binary_remote_addr  zone=tap_zone:10m   rate=10r/s;
limit_req_zone  $binary_remote_addr  zone=site_zone:10m  rate=30r/s;

# When a client exceeds its budget, reply 429 (default is 503) so callers and
# TAP clients can tell they're being throttled rather than hitting an outage.
limit_req_status 429;

server {
    listen 80;

    # TAP endpoint → DACHS
    # Matches /tap, /tap/sync, /tap/async, /tap/tables, etc.
    location /tap {
        # burst absorbs short spikes (async submit + poll bursts); nodelay
        # serves the burst immediately rather than queueing it.
        limit_req           zone=tap_zone burst=20 nodelay;
        proxy_pass          http://dachs:8080;
        proxy_set_header    Host                $host;
        proxy_set_header    X-Real-IP           $remote_addr;
        proxy_set_header    X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto   $scheme;
        # TAP async jobs can take a while
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
    }

    # DACHS's canonical service paths. /tap is only an alias: async job
    # creation returns job URLs under /__system__/tap/run/async/<id>, so
    # async TAP breaks for standard clients without this route.
    location /__system__ {
        limit_req           zone=tap_zone burst=20 nodelay;
        proxy_pass          http://dachs:8080;
        proxy_set_header    Host                $host;
        proxy_set_header    X-Real-IP           $remote_addr;
        proxy_set_header    X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto   $scheme;
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
    }

    # Everything else → Django (includes the SQL/ADQL query form on /)
    location / {
        limit_req           zone=site_zone burst=40 nodelay;
        proxy_pass          http://backend:8000;
        proxy_set_header    Host                $host;
        proxy_set_header    X-Real-IP           $remote_addr;
        proxy_set_header    X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto   $scheme;
        proxy_read_timeout  120s;
    }
}
