[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bobcat_website"
version = "0.0"
authors = [ { name="Jessica Sydnor", email="js0311@mix.wvu.edu"},
            { name="Sarah Burke-Spolaor", email="sarah.spolaor@mail.wvu.edu" },
            { name="Jordan O'Kelley", email="jpo00013@mix.wvu.edu"},
	    { name="Ryan Nowicki", email="ryan.nowicki@vanderbilt.edu"},
	    ]
description = "BOBcat website code for basic web display, query receiving, plot creation, DBdata receiving and displaying."
readme = "README.md"
requires-python = ">3.7"
classifiers = [
    "Programming Language :: Python :: 3",
]
dependencies = [
	     "gw_utils",
	     "django",
	     "numpy",
	     "pandas"
]

[project.urls]
"Homepage" = "http://sarahspolaor.faculty.wvu.edu/"
"Issues" = "https://github.com/jessydno/BOBcat/issues"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "BOBcat_website.settings"
pythonpath = ["BOBcat_website"]
testpaths = ["tests"]
# network tests need the live stack / external services; a bare `pytest`
# should not run them. `pytest -m network` still overrides this default.
addopts = "-m 'not network'"
markers = [
    "network: hits a live external service (NED/SIMBAD/astropy name resolver), opt-in only",
    "django_db: requires a real Postgres test database",
]
# pytest-django reads DJANGO_SETTINGS_MODULE (and settings.py reads
# DJANGO_SECRET_KEY with no fallback) before any conftest.py in tests/ gets
# a chance to run, so the env var has to be injected via pytest-env instead.
env = [
    "DJANGO_SECRET_KEY=test-secret-key-not-for-production",
]
